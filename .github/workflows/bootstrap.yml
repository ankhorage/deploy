name: Bootstrap Ankhorage Repository

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install bootstrap dependencies
        run: bun install

      - name: Synchronize Ankhorage repository tooling
        run: bunx @ankhorage/ankh devtools sync .

      - name: Refresh lockfile
        run: bun install

      - name: Commit synchronized repository state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already synchronized."
            exit 0
          fi
          git commit -m "chore: sync Ankhorage repository tooling"
          git push origin HEAD:main

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip
        run: bun run knip

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Doctor
        run: bunx @ankhorage/ankh doctor validate .
