name: Prepare Provider Extraction

on:
  push:
    branches:
      - refactor/externalize-deploy-providers

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[providers-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Resolve released provider packages
        run: |
          bun add @ankhorage/contracts@^19.2.2 @ankhorage/deploy-provider-eas @ankhorage/deploy-provider-google-play @ankhorage/deploy-provider-app-store-connect
          bun remove google-auth-library
      - name: Audit concrete provider imports
        run: |
          echo '=== provider imports/usages ==='
          grep -RInE "providers/(eas|googlePlay|appStoreConnect|release)|create(Eas|GooglePlay|AppStore)|GooglePlay|AppStoreConnect|Eas" src --include='*.ts' || true
      - name: Commit resolved package versions
        run: |
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: consume external deployment providers [providers-prepared]"
          git push origin HEAD:refactor/externalize-deploy-providers
