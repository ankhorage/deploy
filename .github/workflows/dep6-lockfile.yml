name: DEP6 Finalize

on:
  push:
    branches:
      - agent/android-google-play-target

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/android-google-play-target
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatting
        run: |
          bun run lint:fix
          bun run format
          bun run docs

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize dep6 artifacts"
            git push origin HEAD:agent/android-google-play-target
          fi

      - name: Validate branch
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run changeset:status
          bunx @ankhorage/ankh doctor validate .
