name: DEP 7 autofix

on:
  push:
    branches:
      - agent/dep-7-ios-deployment

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/dep-7-ios-deployment
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository autofixes
        run: |
          bun run lint:fix || true
          bun run format
      - name: Commit autofixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format dep 7 implementation"
          git push origin HEAD:agent/dep-7-ios-deployment
