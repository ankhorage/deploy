name: DEP 8 autofix

on:
  push:
    branches:
      - agent/dep-8-store-listing-sync

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/dep-8-store-listing-sync
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository autofixes
        run: |
          bun run lint:fix || true
          bun run format
      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply dep 8 repository formatting"
          git push origin HEAD:agent/dep-8-store-listing-sync
